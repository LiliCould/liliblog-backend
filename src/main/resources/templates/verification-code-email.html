<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${title} - 立里博客</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
            'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            line-height: 1.7;
            color: #1f2937;
            max-width: 560px;
            margin: 0 auto;
            padding: 24px;
            background-color: #f3f4f6;
        }
        .container {
            background-color: #ffffff;
            border: 1px solid #e5e7eb;
            padding: 0;
        }
        .header {
            padding: 28px 32px 24px;
            border-bottom: 1px solid #e5e7eb;
        }
        .brand {
            font-size: 18px;
            font-weight: 700;
            color: #0284c7;
            letter-spacing: -0.5px;
            margin: 0 0 4px;
        }
        .brand span {
            color: #6b7280;
            font-weight: 400;
        }
        .content {
            padding: 24px 32px;
        }
        .content p {
            margin: 8px 0;
            font-size: 14px;
            color: #374151;
        }
        .code-box {
            background-color: #f8fafc;
            border: 2px dashed #0284c7;
            padding: 20px;
            margin: 20px 0;
            text-align: center;
        }
        .code-label {
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 10px;
        }
        .highlight {
            display: inline-block;
            font-size: 32px;
            font-weight: 700;
            color: #0284c7;
            letter-spacing: 4px;
            padding: 8px 16px;
            background-color: #ffffff;
            border: 1px solid #bfdbfe;
        }
        .warning-box {
            background-color: #fffbeb;
            border: 1px solid #fde68a;
            padding: 14px 16px;
            margin: 16px 0;
            color: #92400e;
            font-size: 13px;
        }
        .divider {
            height: 1px;
            background-color: #e5e7eb;
            margin: 0;
        }
        .footer {
            padding: 20px 32px;
            color: #9ca3af;
            font-size: 12px;
            text-align: center;
            line-height: 1.8;
        }
        .footer a {
            color: #0284c7;
            text-decoration: none;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <p class="brand"><span>LiliBlog</span></p>
    </div>
    <div class="content">
        <p>尊敬的用户，您好：</p>
        <p>${content}</p>

        <div class="code-box">
            <div class="code-label">您的验证码</div>
            <div class="highlight">${code}</div>
        </div>

        <div class="warning-box">
            <strong>安全提示：</strong>请勿将验证码泄露给他人。如非本人操作，请忽略此邮件。
        </div>
    </div>
    <div class="divider"></div>
    <div class="footer">
        <p>此邮件由立里博客自动发送，请勿回复</p>
        <p>&copy; 2025-2026 <a href="https://lilicould.cn">lilicould.cn</a></p>
    </div>
</div>
</body>
</html>
