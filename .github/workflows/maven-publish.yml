name: Deploy liliblog-service

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -pl liliblog-service -am -DskipTests

      - name: Deploy jar to server
        uses: easingthemes/ssh-deploy@v5
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          SOURCE: "liliblog-service/target/liliblog-service-2.0.2.jar"
          TARGET: "/opt/liliblog/"
          ARGS: "-o StrictHostKeyChecking=no"

      - name: Restart service
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 备份旧 jar 包（格式：liliblog20260912.jar 或 liliblog20260912_2.jar）
            BACKUP_DATE=$(date +%Y%m%d)
            BACKUP_DIR="/opt/liliblog/backup"
            mkdir -p $BACKUP_DIR
            
            # 查找当天已有的备份数量，确定后缀
            EXISTING=$(ls -1 $BACKUP_DIR/liliblog${BACKUP_DATE}*.jar 2>/dev/null | wc -l)
            if [ $EXISTING -eq 0 ]; then
              SUFFIX=""
            else
              SUFFIX="_$EXISTING"
            fi
            
            # 备份当前 jar 包
            if [ -f /opt/liliblog/liliblog.jar ]; then
              cp /opt/liliblog/liliblog.jar $BACKUP_DIR/liliblog${BACKUP_DATE}${SUFFIX}.jar
            fi
            
            # 替换新 jar 包
            mv /opt/liliblog/liliblog-service-2.0.2.jar /opt/liliblog/liliblog.jar
            
            # 重启服务
            sudo systemctl restart liliblog.service
            sleep 3
            
            # 检查服务状态
            systemctl is-active liliblog.service