name: Deploy liliblog-service

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -pl liliblog-service -am -DskipTests

      - name: Deploy jar to server
        uses: easingthemes/ssh-deploy@v5
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          SOURCE: "liliblog-service/target/liliblog-service-2.0.2.jar"
          TARGET: "/opt/liliblog/"
          ARGS: "-o StrictHostKeyChecking=no"

      - name: Restart service
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 重命名 jar 包
            mv /opt/liliblog/liliblog-service-2.0.2.jar /opt/liliblog/liliblog.jar
            # 重启服务
            sudo systemctl restart liliblog.service
            sleep 3
            # 检查服务状态
            systemctl is-active liliblog.service
