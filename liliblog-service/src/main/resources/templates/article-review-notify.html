<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新文章待审核 - 立里博客</title>
</head>
<body style="margin:0;padding:0;background-color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0" style="background-color:#f8fafc;padding:32px 16px;">
    <tr>
        <td align="center">
            <table width="560" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border:1px solid #e2e8f0;overflow:hidden;">
                <!-- Top Accent -->
                <tr>
                    <td style="height:4px;background-color:#0284c7;font-size:0;line-height:0;">&nbsp;</td>
                </tr>
                <!-- Header -->
                <tr>
                    <td style="padding:24px 32px;border-bottom:1px solid #e2e8f0;">
                        <table cellpadding="0" cellspacing="0">
                            <tr>
                                <td style="vertical-align:middle;">
                                    <img src="https://oss.lilicould.cn/image/liliblog-logo.png" alt="LiliBlog" style="height:40px;width:auto;" />
                                </td>
                                <td style="vertical-align:middle;padding:0 12px;font-size:14px;color:#cbd5e1;">|</td>
                                <td style="vertical-align:middle;font-size:13px;color:#94a3b8;">立里可的技术与生活分享空间</td>
                            </tr>
                        </table>
                        <div style="margin-top:14px;display:inline-block;padding:4px 14px;font-size:12px;font-weight:600;color:#d97706;background-color:#fffbeb;border:1px solid #fde68a;border-radius:4px;">待审核</div>
                    </td>
                </tr>
                <!-- Content -->
                <tr>
                    <td style="padding:28px 32px;">
                        <p style="margin:0 0 16px;font-size:14px;color:#334155;line-height:1.7;">你好，有一篇新文章提交了审核：</p>

                        <div style="padding:14px 18px;margin:0 0 20px;border-left:3px solid #0284c7;background-color:#f8fafc;">
                            <span style="font-weight:600;font-size:15px;color:#0f172a;">《${articleTitle}》</span>
                        </div>

                        <table width="100%" cellpadding="0" cellspacing="0" style="margin:0 0 20px;background-color:#f8fafc;border:1px solid #e2e8f0;">
                            <tr>
                                <td style="padding:12px 16px;font-size:14px;color:#475569;">
                                    <span style="color:#64748b;">作者：</span>${authorName}
                                </td>
                            </tr>
                            <tr>
                                <td style="padding:12px 16px;font-size:14px;color:#475569;border-top:1px solid #e2e8f0;">
                                    <span style="color:#64748b;">提交时间：</span>${submitTime}
                                </td>
                            </tr>
                        </table>

                        <p style="margin:0;font-size:13px;color:#64748b;">请及时审核。</p>
                    </td>
                </tr>
                <!-- Footer -->
                <tr>
                    <td style="padding:20px 32px;border-top:1px solid #e2e8f0;text-align:center;">
                        <p style="margin:0;font-size:12px;color:#94a3b8;line-height:1.8;">
                            此邮件由立里博客自动发送，请勿回复<br>
                            &copy; 2025-2026 <a href="https://lilicould.cn" style="color:#0284c7;text-decoration:none;">lilicould.cn</a>
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
