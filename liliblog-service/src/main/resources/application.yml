spring:
  application:
    name: liliblog
  profiles:
    active: dev
  datasource:
    driver-class-name: ${liliblog.datasource.driver-class-name}
    url: ${liliblog.datasource.url}
    username: ${liliblog.datasource.username}
    password: ${liliblog.datasource.password}
    hikari:
      minimum-idle: ${liliblog.datasource.hikari.minimum-idle}  # 启动时就创建5个空闲连接
      connection-test-query: ${liliblog.datasource.hikari.connection-test-query}
      initialization-fail-timeout: ${liliblog.datasource.hikari.initialization-fail-timeout}
  data:
    redis:
      host: ${liliblog.data.redis.host}
      password: ${liliblog.data.redis.password}
      port: ${liliblog.data.redis.port}
      database: ${liliblog.data.redis.database}
      timeout: ${liliblog.data.redis.timeout}
      lettuce:
        pool:
          max-active: ${liliblog.data.redis.lettuce.pool.max-active}
          max-idle: ${liliblog.data.redis.lettuce.pool.max-idle}
          min-idle: ${liliblog.data.redis.lettuce.pool.min-idle}
          max-wait: ${liliblog.data.redis.lettuce.pool.max-wait}
  servlet:
    multipart:
      enabled: true
      max-file-size: 40MB
      # 必须大于 max-file-size：multipart 边界头、文件名、type 表单字段都要占额度，
      # 与 max-file-size 设成相同值会导致接近上限的正常文件被误判为超限
      max-request-size: 45MB
      # 注意：location / file-size-threshold / resolve-lazily 对默认的
      # StandardServletMultipartResolver 无效，临时目录只能通过 -Djava.io.tmpdir 指定
      # 参见 DEPLOY.md 中 systemd 的 JAVA_OPTS
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${liliblog.github.client-id}          # github上申请的应用ID
            client-secret: ${liliblog.github.client-secret}  # github上申请的应用密钥
            scope: read:user, user:email                     # 请求用户信息权限
            redirect-uri: ${liliblog.github.redirect-uri}    # 回调地址
            client-name: GitHub
        provider:
          github:
            authorization-uri: https://github.com/login/oauth/authorize
            token-uri: https://github.com/login/oauth/access_token
            user-info-uri: https://api.github.com/user
            user-name-attribute: id                         # 使用 GitHub 用户的数字 ID（不可变）作为 Principal名称

  mail:
    host: smtp.qq.com
    port: 587
    username: ${liliblog.mail.username}
    password: ${liliblog.mail.password}
    default-encoding: UTF-8
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true # 启用SMTP验证
          starttls: # 开启TLS
            enable: true # 开启SSL
            required: true # 强制要求使用TLS

server:
  tomcat:
    # 必须 >= max-request-size。Tomcat 默认仅 2MB，上传被中断时会直接 reset 连接
    max-swallow-size: 45MB
    connection-timeout: 60s

logging:
  level:
    root: ${liliblog.logging.level.root}

app:
  cors:
    allowed-origins:
      - http://localhost:3000
      - https://lilicould.cn
      - https://*.lilicould.cn
  info:
    admin-email: "lilicould@qq.com" # 管理员邮箱

# MyBatis-plus配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath:mapper/*.xml
  global-config:
    db-config:
      logic-delete-field: deleted # 全局逻辑删除字段
      logic-not-delete-value: 0   # 0表示未删除
      logic-delete-value: 1       # 1表示已删除

springdoc:
  api-docs:
    path: /v3/api-docs    # 自定义JSON文档路径
    enabled: true # 生产环境设置为false
  swagger-ui:
    path: /swagger-ui.html # 自定义UI路径
    enabled: true

nextdoc4j:
  enabled: true # 是否启用 NextDoc4j，默认 false

http-only-cookies:
  ssl: ${liliblog.http-only-cookies.ssl} # https验证，生产环境需设为true
  domain: "lilicould.cn"

jwt:
  # 密钥（secret）必须是经过Base64编码的32字节（或更长）的字符串
  secret: ${liliblog.jwt.secret}
  expiration: ${liliblog.jwt.expiration} # 访问令牌有效期，单位毫秒
  refresh-expiration: ${liliblog.jwt.refresh-expiration} # 刷新令牌有效期，单位毫秒

oss:
  access-key: ${liliblog.oss.access-key}
  secret-key: ${liliblog.oss.secret-key}
  bucket: ${liliblog.oss.bucket}
  oss-url: "https://oss.lilicould.cn"
  # 七牛区域 ID：z0=华东 z1=华北 z2=华南 na0=北美。bucket 所在区域填错会导致每次上传都跨区
  region: z0
  # SDK 连接超时（秒）
  connect-timeout: 10
  # SDK 单次 socket 写超时（秒），传 0 表示不限制（SDK 默认值）
  write-timeout: 60
  # 分片上传的分片大小，七牛要求 1MB~1GB。SDK 每次只驻留一个分片，
  # 所以「单个在途上传占多少堆内存」就等于这个值
  block-size: 1MB
  # 同时进行的上传数上限。堆峰值 ≈ 该值 × block-size。
  # 上传改为同步执行后，线程池不再限流，这里是唯一的并发闸门，调高会线性放大内存峰值
  max-concurrent-uploads: 5
  # 等待上传许可的最长秒数，应显著大于单次上传耗时，否则慢上行链路下会误报繁忙。
  # 注意：40MB 文件在 1Mbps 上行约需 320s，若并发已满，后续请求会在此超时
  queue-wait-seconds: 60
  # 各业务类型的大小上限，超限在读取文件前即被拒绝，不浪费上行带宽
  size-limits:
    avatar: 5MB
    cover: 10MB
    image: 40MB
    file: 40MB
  allowed-media-types:
    - image/jpeg
    - image/png
    - image/gif
#    - image/svg+xml          # svg 有 XSS 风险，个人需要才加
    - image/webp
    - video/mp4
    - video/x-msvideo        # avi
    - video/x-ms-wmv         # wmv
    - audio/mpeg             # mp3
    - application/pdf
    - application/msword     # doc
    - application/vnd.openxmlformats-officedocument.wordprocessingml.document   # docx
    - application/vnd.ms-excel                                             # xls
    - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet      # xlsx
    - application/vnd.ms-powerpoint                                          # ppt
    - application/vnd.openxmlformats-officedocument.presentationml.presentation # pptx
    - text/markdown                # md
    - text/x-web-markdown